<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SmartCalc Studio | Contact</title>
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
  <div class="site-shell">
    <header class="site-header">
      <a class="brand" href="home.html">
        <span class="brand-mark">SC</span>
        <span>SmartCalc Studio</span>
      </a>
      <nav class="nav-links" aria-label="Main navigation">
        <a href="home.html">Home</a>
        <a href="calcy.html">Calculator</a>
        <a href="area.html">Area</a>
        <a href="volume.html">Volume</a>
        <a href="bmi.html">BMI</a>
        <a class="active" href="contactus.html">Contact</a>
        <a href="info.html">Developer</a>
      </nav>
    </header>

    <main>
      <section class="subhero">
        <div>
          <p class="eyebrow">Feedback</p>
          <h1>Share a problem, idea, or correction.</h1>
          <p>Questions and feedback for the calculator project.</p>
        </div>
        <div class="subhero-media">
          <img src="contactus.jpg" alt="Contact background">
        </div>
      </section>

      <section class="workspace contact-layout">
        <div class="media-panel">
          <img src="nature.jpg" alt="Calm study scene">
        </div>

        <form class="calc-card" data-contact-form>
          <h2>Contact Form</h2>
          <p>Send useful information so a developer can understand the issue quickly.</p>
          <div class="fields">
            <div class="field"><label for="name">Name</label><input id="name" name="name" type="text" required></div>
            <div class="field"><label for="email">Email</label><input id="email" name="email" type="email" required></div>
            <div class="field"><label for="phone">Contact Number</label><input id="phone" name="phone" type="tel"></div>
            <div class="field"><label for="topic">Topic</label><input id="topic" name="topic" type="text" placeholder="Calculator, layout, formula"></div>
          </div>
          <div class="field">
            <label for="message">Message</label>
            <textarea id="message" name="message" required placeholder="Write your feedback here"></textarea>
          </div>
          <button class="btn btn-primary" type="submit">Submit Feedback</button>
          <p class="status-message" data-status aria-live="polite"></p>
        </form>
      </section>
    </main>
  </div>
  <script src="assets/js/app.js"></script>
</body>
</html>
